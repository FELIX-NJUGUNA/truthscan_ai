<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TruthScan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Login</h3>
                    </div>
                    <div class="card-body">
                        <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
                        <form id="loginForm" method="POST" action="#">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <div class="mt-3 text-center">
                            <p>Don't have an account? <a href="/register_form">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const username = usernameInput.value;
            const password = passwordInput.value;
            const errorMessageDiv = document.getElementById('errorMessage');

            errorMessageDiv.style.display = 'none'; // Hide error message initially
            errorMessageDiv.textContent = ''; // Clear previous error

            if (!username || !password) {
                errorMessageDiv.textContent = 'Username and password are required.';
                errorMessageDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/login', { // Using fixed path /login
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) { // Typically status 200
                    if (data.token && data.username) {
                        localStorage.setItem('jwt_token', data.token);
                        localStorage.setItem('username', data.username);
                        window.location.href = '/'; // Redirect to homepage
                    } else {
                        errorMessageDiv.textContent = (data && data.error) || 'Login successful, but token or username missing in response.';
                        errorMessageDiv.style.display = 'block';
                    }
                } else {
                    errorMessageDiv.textContent = (data && data.error) || `Login failed. Please try again. Status: ${response.status}`;
                    errorMessageDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessageDiv.textContent = 'An unexpected error occurred. Please check your connection and try again.';
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
